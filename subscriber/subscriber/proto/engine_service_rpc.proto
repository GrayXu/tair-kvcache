syntax = "proto3";

enum KvCacheDescriptorErrorCode {
  KV_CACHE_DESCRIPTOR_OK = 0;
  KV_CACHE_DESCRIPTOR_UNAVAILABLE = 1;
}

message KvCacheGroupDescriptorPB {
  int32 group_idx = 1;
  string kind = 2;
  int32 block_size = 3;
  int32 sliding_window = 4;
}

message EngineCacheSettingsPB {
  bool use_eagle_pop = 1;
  string mamba_cache_mode = 2;
}

message KvCacheDescriptorPB {
  repeated KvCacheGroupDescriptorPB items = 1;
  EngineCacheSettingsPB settings = 2;
  KvCacheDescriptorErrorCode err_code = 3;
  string err_msg = 4;
}

message KvCacheDescriptorRequestPB {}

message StatusVersionPB {
  int64 latest_cache_version = 1;
  int64 latest_finished_version = 2;
}

message WorkerStatusPB {
  // Fields 1-11 are reserved for other worker status information.
  int64 status_version = 12;
  bool alive = 13;
  // Field 14 is reserved for precision in the authoritative schema.
  int64 latest_finished_version = 15;
}

message KvCacheBlockListPB {
  bytes raw_snapshot = 1;
  int64 snapshot_version = 2;
  int32 block_size = 3;
}

message KvCacheBlocksRequestPB {}

service RpcService {
  rpc GetKvCacheDescriptor(KvCacheDescriptorRequestPB)
      returns (KvCacheDescriptorPB);
  rpc GetWorkerStatus(StatusVersionPB) returns (WorkerStatusPB);
  rpc GetAllKvCacheBlocks(KvCacheBlocksRequestPB)
      returns (KvCacheBlockListPB);
}
