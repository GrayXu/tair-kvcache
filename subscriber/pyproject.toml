[project]
name = "tair-kvcache-subscriber"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "grpcio==1.75.1",
    "protobuf==3.20.3",
    "pyzmq>=26",
    "msgspec>=0.18",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

# Single source for dev deps. AoneCI installs via `pip install '.[dev]'`
# (extras); uv's dev dependency-group below references this extra.
[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "types-pyyaml>=6.0",
    "types-grpcio>=1.0",
    "types-protobuf>=3.20",
]

[dependency-groups]
dev = ["tair-kvcache-subscriber[dev]"]

[project.scripts]
subscriber = "subscriber.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["subscriber"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    "subscriber/proto/*_pb2*.py",
    "subscriber/proto/*_pb2*.pyi",
    "benchmark/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"subscriber/proto/*_pb2*.py" = ["ALL"]
"subscriber/proto/*_pb2*.pyi" = ["ALL"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["benchmark/"]

[[tool.mypy.overrides]]
module = ["dashlog"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["subscriber.proto.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["subscriber.engine.dashllm_grpc"]
disable_error_code = ["no-untyped-call"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: real ZMQ socket tests (no mocks)",
    "e2e: end-to-end tests against the real dashservingd binary",
]

# Coverage gate: baseline is 91% (2026-07); fail_under leaves 1% headroom.
# Raise it as coverage improves, never lower it to make a commit pass.
[tool.coverage.report]
fail_under = 90

[tool.uv]
[[tool.uv.index]]
url = "https://artlab.alibaba-inc.com/1/pypi/simple"
default = true
